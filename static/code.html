<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter code</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0d0a1f; color:#fff; font-family:system-ui, sans-serif; }
  form { display:flex; flex-direction:column; gap:12px; width:min(320px, 88vw); }
  input, button { padding:14px; border-radius:10px; border:1px solid #333; font-size:18px; }
  input { background:#1a1430; color:#fff; text-transform:uppercase; letter-spacing:2px; text-align:center; }
  button { background:#6c5ce7; color:#fff; border:0; font-weight:600; cursor:pointer; }
  #err { color:#ff7675; min-height:1em; font-size:14px; text-align:center; }
</style>
</head>
<body>
<form onsubmit="go(event)">
  <input id="code" placeholder="Invite code" autocomplete="off" autofocus>
  <button>Enter</button>
  <div id="err"></div>
</form>
<script>
async function go(e) {
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  location.href = location.pathname + '?code=' + encodeURIComponent(code);
}
</script>
</body>
</html>
